server { # блок сервера
    listen 80; # слушать порт 80 внутри контейнера. снаружи (на компьютере) проброшен как 8000 (в docker-compose.yml)
    server_name localhost;   # имя сервера. По какому домену отвечать.
    root /var/www/public; # корневая папка сайта. /var/www — это рабочая папка контейнера (WORKDIR в Dockerfile), /public — единственная доступная извне папка Laravel(там лежит index.php — единая точка входа)
    index index.php index.html; # файлы по умолчанию. Если URL указывает на папку, искать index.php или index.html внутри

    #  Правило для всех обычных запросов
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        # попробуй найти файл по этому пути ($uri), если нет — папку ($uri/),если нет — передать в index.php с параметрами URL ($query_string).
        # Это нужно из-за роутинга Laravel: URL /notes/5 не соответствует файлу, Nginx передаёт его в index.php, а Laravel сам разбирается по маршрутам.
    }

    #  Правило для PHP-файлов
    location ~ \.php$ { # ~  регулярное выражение.
                       # \.php$ — URL оканчивается на .php
        fastcgi_pass app:9000;  # передать запрос в PHP-FPM.
        # app — имя сервиса в docker-compose.yml, 9000 — порт, на котором слушает PHP-FPM. Nginx находит app через общую сеть todo_network.
        fastcgi_index index.php; # если запрос на папку — использовать index.php
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # сообщить PHP-FPM, какой именно файл выполнять.
        # $document_root = /var/www/public,
        # $fastcgi_script_name = имя скрипта (например index.php)
        include fastcgi_params; # подключить стандартные параметры FastCGI, которые идут с Nginx из коробки
    }

    #  Запрет доступа к служебным файлам
    location ~ /\.ht { # URL, содержащий /.ht (например /.htaccess)
        deny all;   # запретить доступ всем. Это защита, эти файлы не должны отдаваться наружу
    }
}