services:
  app:
    build:
      context: . # где искать файлы для сборки. "." — корень проекта
      dockerfile: Dockerfile  # какой Dockerfile использовать для сборки образа
    container_name: todo_app  # имя контейнера. По нему можно обращаться: docker exec -it todo_app bash
    working_dir: /var/www  # рабочая папка внутри контейнера при запуске
    volumes:  #том. связать папку проекта на компьютере с папкой в контейнере.
      - ./:/var/www  # Изменения в коде сразу видны в контейнере, без пересборки.
    networks: # подключить к общей сети (чтобы видеть db и nginx)
      - todo_network

  db:
    image: mysql:8.0  # готовый образ MySQL 8.0 из Docker Hub
    container_name: todo_db
    environment:  # переменные окружения внутри контейнера. MySQL при первом запуске создаёт базу и root-пароль по ним.
      MYSQL_DATABASE: todo_laravel   # имя базы, которую создаст MySQL
      MYSQL_ROOT_PASSWORD: secret    # пароль пользователя root
    ports: # проброс портов: внешний:внутренний. Теперь MySQL доступен на 127.0.0.1:3307.
      - "3307:3306" # 3306 — порт MySQL внутри контейнера, 3307 — на компьютере (3306 занят OSPanel)
    volumes:
      - db_data:/var/lib/mysql  # именованный том. Данные БД сохранятся, даже если удалить контейнер.
    networks:
      - todo_network

  nginx:
    image: nginx:alpine # готовый образ Nginx (alpine = облегчённый Linux, меньше размер)
    container_name: todo_nginx
    ports:
      - "8000:80"  # 80 — порт Nginx внутри контейнера, 8000 — на компьютере. http://127.0.0.1:8000
    volumes:
      - ./:/var/www  # файлы проекта — чтобы Nginx видел их
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf # конфиг Nginx с компьютера подставляется в контейнер. Объясняет Nginx, куда перенаправлять PHP-запросы.
    networks:
      - todo_network

  adminer:
    image: adminer
    container_name: todo_adminer
    ports:
      - "8080:8080"
    networks:
      - todo_network

volumes:
  db_data: # объявление именованного тома для данных MySQL. Docker сам создаст его при первом запуске.

networks:
  todo_network:
    driver: bridge # тип сети. bridge — виртуальный сетевой мост, через который контейнеры видят друг друга по имени сервиса.